name: Build and Deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set build info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_TIME=$(TZ=America/New_York date)
          sed -i "s/CI_COMMIT_SHORT_SHA/${GITHUB_SHA:0:8}/" src/environments/*.ts
          sed -i "s/CI_PIPELINE_ID/$GITHUB_RUN_ID/" src/environments/*.ts
          sed -i "s/BUILD_TIME/$BUILD_TIME/" src/environments/*.ts
          sed -i "s/VERSION/$VERSION/" src/environments/*.ts

      - name: Build
        run: npm run build:prod

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/megha-kaul/browser
