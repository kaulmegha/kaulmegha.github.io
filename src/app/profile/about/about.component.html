<div class="section" id="about">
  <div class="container">
    <div class="card" data-aos="fade-up" data-aos-offset="10">
      <div class="row">
        <div class="col-lg-6 col-md-12">
          <div class="card-body">
            <div class="h4 mt-0 title">About Me</div>
            <ng-container *ngFor="let para of about$ | async">
              <p>{{para}}</p>
            </ng-container>
          </div>
        </div>
        <div class="col-lg-6 col-md-12">
          <div class="card-body">
            <div class="h4 mt-0 title">Basic Information</div>
            <ng-container *ngTemplateOutlet="basic; context: {key: 'Name', value: 'Megha Kaul'}"></ng-container>
            <ng-container *ngTemplateOutlet="basic; context: {key: 'Email', value: 'megha.aa12@gmail.com'}"></ng-container>
            <ng-container *ngTemplateOutlet="basic; context: {key: 'Phone', value: '+1 (315) 358-6081'}"></ng-container>
            <ng-container *ngTemplateOutlet="basic; context: {key: 'LinkedIn', value: 'linkedin.com/in/megha-kaul'}"></ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #basic let-key="key" let-value="value">
  <div class="row mt-3">
    <div class="col-sm-4">
      <strong class="text-uppercase">{{key}}:</strong>
    </div>
    <div class="col-sm-8">{{value}}</div>
  </div>
</ng-template>
